
num_iter: 4
run_name: run_pepr_aphm_cine_to_pepr_cine
output_path: ${oc.env:LOG_PATH}/${run_name}/

var_file: ${output_path}/variables.pkl

target: pepr_cine
source: pepr_aphm_cine_train

#
# supervised params
#
sup_num_epochs: 300

# Increases randomness in initial model
sup_loss_label_smoothing: 0.0

#
# RL params
#
rl_num_epochs: 5
rl_num_predict: 2500
rl_overrides: []

split: 0

#
# RewardNet params
#
rn_num_epochs: 50
